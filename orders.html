:root{
  --bg:#F4F7FB; --surface:#ffffff; --surface2:#F8FAFD;
  --border:rgba(10,22,40,0.07); --border-strong:rgba(10,22,40,0.10);
  --text:#0B1220; --text2:#5E6B7D; --text3:#9AA3B2;
  --accent:#0A9BDC; --accent-soft:rgba(10,155,220,0.08);
  --orange:#F26430; --orange-soft:rgba(242,100,48,0.10);
  --green:#0A9B72; --green-soft:rgba(10,155,114,0.10);
  --yellow:#E5A020; --yellow-soft:rgba(229,160,32,0.10);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.04),0 1px 2px rgba(0,0,0,0.02);
  --radius:18px; --radius-sm:12px;
  --font-body:'DM Sans',sans-serif; --font-display:'Plus Jakarta Sans',sans-serif;
  --header-h:56px; --bottom-nav-h:64px;
}
body.dark-mode{
  --bg:#0B0F18; --surface:#141B2A; --surface2:#1A2235;
  --border:rgba(255,255,255,0.06); --border-strong:rgba(255,255,255,0.10);
  --text:#F0F4FA; --text2:#A0AAB8; --text3:#6B7585;
  --accent:#2DBEF5; --accent-soft:rgba(45,190,245,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,h5,h6{font-family:var(--font-display)}
body{
  font-family:var(--font-body);background:var(--bg);color:var(--text);
  min-height:100dvh;padding-bottom:calc(var(--bottom-nav-h) + 24px);
  transition:background .3s,color .3s;
}
.s-header{
  position:sticky;top:0;z-index:50;
  background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(255,255,255,0.03) 0%,transparent 65%),radial-gradient(ellipse 60% 80% at -10% 0%,rgba(124,111,247,0.18) 0%,transparent 55%),linear-gradient(180deg,#0f3258 0%,#002248 22%,#001f3c 55%,#001532 82%,#000d20 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.06),inset 0 -1px 0 rgba(0,0,0,0.65),0 6px 28px rgba(0,0,0,0.55),0 1px 2px rgba(0,0,0,0.7);
  border-bottom:1px solid rgba(0,0,0,0.5);
  height:var(--header-h);

/* Buy For Me dynamic cards */
.px-state{ text-align:center;padding:40px 16px;color:var(--text3);font-size:13px;font-weight:600; }
.px-state a{ color:var(--orange);font-weight:800;text-decoration:none; }
.oc-id.rq{ color:var(--orange);background:rgba(242,100,48,0.08);border:1.5px solid rgba(242,100,48,0.55); }
body.dark-mode .oc-id.rq{ background:rgba(242,100,48,0.14);border-color:rgba(242,100,48,0.6); }
.oc-status-pill.closed{ background:rgba(217,83,83,0.10);color:#d95353;border-color:rgba(217,83,83,0.4); }
.px-quote{ margin:2px 0 14px;padding:14px;border-radius:14px;background:var(--orange-soft);border:1.5px solid rgba(242,100,48,0.4); }
.px-quote-top{ display:flex;justify-content:space-between;align-items:flex-end;gap:10px; }
.px-quote-lbl{ font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--text3); }
.px-quote-amt{ font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--orange);line-height:1.1; }
.px-quote-exp{ font-size:11px;font-weight:600;color:var(--text3);text-align:right; }
.px-quote-btns{ display:flex;gap:10px;margin-top:12px; }

.px-btn:disabled{ opacity:.6; }
.px-btn.accept{ background:var(--green);color:#fff; }

.px-banner{ margin-bottom:14px;padding:12px 14px;border-radius:12px;font-size:12.5px;font-weight:700;background:rgba(217,83,83,0.08);color:#d95353;border:1px solid rgba(217,83,83,0.3); }
.px-info{ margin-bottom:14px;padding:12px 14px;border-radius:12px;font-size:12.5px;font-weight:600;background:var(--surface);color:var(--text);border:1px dashed rgba(242,100,48,0.45); }
.px-note{position:relative;margin:2px 0 14px;padding:10px 12px 10px 15px;border-radius:10px;background:var(--surface2);cursor:pointer;-webkit-tap-highlight-color:transparent;overflow:hidden}

/* Flow tabs */
.flow-tabs{ margin:12px 16px 0; }
/* Running-order count badges on the two tabs (same pill shape as the admin + sheet badges) */
.flow-tab .tab-count{box-sizing:border-box;position:absolute;top:-6px;right:0;box-shadow:0 2px 6px rgba(230,72,72,.35);min-width:22px;height:17px;padding:0 5px;border-radius:99px;background:#e64848;color:#fff;border:0;margin:0;letter-spacing:0;text-transform:none;font:800 10px/1 'Plus Jakarta Sans',var(--font-display),sans-serif;place-items:center;display:none;place-items:center;transform:scale(0);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}

#tabStoreCount,#tabProxyCount{--c:#e64848}
@media (prefers-reduced-motion:reduce){.tab-count{transition:none}}
#tabStoreOrders.active{ color:var(--accent); }
#tabProxyOrders.active{ color:var(--orange); }

#viewProxyOrders .order-card{ border-color:rgba(242,100,48,0.30); }

#viewProxyOrders .oc-item-img{ background:linear-gradient(135deg,var(--orange-soft),var(--bg)); }
#viewProxyOrders .oc-track-link{ background:var(--orange);box-shadow:0 4px 14px rgba(242,100,48,0.22); }

#viewProxyOrders .oc-step.done .oc-line{ background:var(--orange); }
#viewProxyOrders .oc-step.current .oc-dot{ background:var(--orange);box-shadow:0 0 0 1px var(--orange);animation:pulseDotOrange 1.6s ease-in-out infinite; }

.oc-body{ padding:14px;display:flex;flex-direction:column;gap:16px; }
.oc-section-label{
  font-size:10px;font-weight:800;color:var(--text3);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px;
}

/* Collapsible sub-sections (Items / Order Summary) */
.oc-subhead{
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;margin-bottom:7px;-webkit-tap-highlight-color:transparent;
}
.oc-subhead .oc-section-label{ margin-bottom:0; }
.oc-subhead-right{ display:flex;align-items:center;gap:6px; }
.oc-subtotal-preview{
  font-size:11px;font-weight:800;color:var(--text2);
  opacity:0;transition:opacity .2s;
}
.oc-subsection.collapsed .oc-subtotal-preview{ opacity:1; }
.oc-sub-chevron{
  width:14px;height:14px;color:var(--text3);flex-shrink:0;

}
.oc-subsection.collapsed .oc-sub-chevron{ transform:rotate(-90deg); }
.oc-subsection-content{
  display:grid;grid-template-rows:1fr;
  transition:grid-template-rows .28s ease;
}
.oc-subsection.collapsed .oc-subsection-content{ grid-template-rows:0fr; }
.oc-subsection-content > div{ overflow:hidden; }

/* Customer */
.oc-customer-card{
  background:var(--surface2);border-radius:var(--radius-sm);
  padding:11px 12px;display:flex;flex-direction:column;gap:8px;
}
.oc-customer-row{ display:flex;align-items:center;gap:9px; }
.oc-customer-row svg{ width:15px;height:15px;color:var(--text3);flex-shrink:0; }
.oc-customer-row span{ font-size:12.5px;font-weight:700;color:var(--text); }
.oc-customer-row.addr span{ font-weight:600;color:var(--text2);line-height:1.4; }

/* Products */
.oc-item-row{ display:flex;gap:10px;align-items:flex-start; }
.oc-item-row + .oc-item-row{ margin-top:12px; }
.oc-item-img{
  width:52px;height:52px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent-soft),var(--bg));
  display:flex;align-items:center;justify-content:center;
}
.oc-item-img svg{ width:24px;height:24px;color:var(--text3);opacity:.3; }
.oc-item-img{ overflow:hidden; }
.oc-item-img img{ width:100%;height:100%;object-fit:cover;display:block; }
.oc-item-name-row{ display:flex;align-items:center;gap:6px; }
.oc-cat-badge{
  width:16px;height:16px;border-radius:5px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.oc-cat-badge svg{ width:9px;height:9px;color:#fff; }
.oc-cat-badge.cat-supplement{ background:linear-gradient(135deg,#009b72,#00704f); }
.oc-cat-badge.cat-gadget{ background:linear-gradient(135deg,#0EA5E9,#0284C7); }
.oc-cat-badge.cat-cosmetic{ background:linear-gradient(135deg,#EC4899,#DB2777); }
.oc-cat-badge.cat-clothing{ background:linear-gradient(135deg,#6761a8,#4a4480); }
.oc-cat-badge.cat-general{ background:linear-gradient(135deg,#64748B,#475569); }
.oc-item-name{ font-size:12.5px;font-weight:700;color:var(--text);line-height:1.3; }
.oc-item-sub{ font-size:10.5px;color:var(--text3);font-weight:600;margin-top:2px;margin-left:22px; }
.oc-item-math{ text-align:right;flex-shrink:0; }
.oc-item-qtyprice{ font-size:10px;color:var(--text3);font-weight:600;white-space:nowrap; }
.oc-item-linetotal{ font-size:12.5px;font-weight:800;color:var(--text);margin-top:1px; }

/* Math */
.oc-math-card{
  background:var(--surface2);border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);
  box-shadow:inset 0 1px 2px rgba(11,18,32,0.04);
  padding:11px 12px;display:flex;flex-direction:column;gap:7px;
  margin-top:14px;
}
.vcode{font-family:'SV Code','Courier Prime','Courier New',monospace;font-weight:700;letter-spacing:.03em}
.oc-math-row{ display:flex;justify-content:space-between;align-items:center; }
.oc-math-row span:first-child{ font-size:12px;font-weight:600;color:var(--text2); }
.oc-math-row span:last-child{ font-size:12px;font-weight:700;color:var(--text); }
.oc-math-row.discount span:last-child{ color:var(--green); }
.oc-math-row.total{ padding-top:8px;border-top:1px solid var(--border-strong); }
.oc-math-row.total span:first-child{ font-size:13px;font-weight:800;color:var(--text); }
.oc-math-row.total span:last-child{ font-family:var(--font-display);font-size:15px;font-weight:800; }

/* Timeline */
.oc-progress{ display:flex;align-items:center;gap:0; }
.oc-step{ flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative; }
.oc-dot{
  width:9px;height:9px;border-radius:50%;background:var(--border-strong);
  border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border-strong);z-index:1;
}
.oc-step.done .oc-dot{ background:var(--accent);box-shadow:0 0 0 1px var(--accent); }
.oc-line{ position:absolute;top:4px;left:-50%;width:100%;height:2px;background:var(--border-strong);z-index:0; }
.oc-step:first-child .oc-line{ display:none; }
.oc-step.done .oc-line{ background:var(--accent); }
.oc-step.current .oc-dot{ background:var(--accent);box-shadow:0 0 0 1px var(--accent);animation:pulseDot 1.6s ease-in-out infinite; }
.oc-step.delivered.done .oc-dot{ background:var(--green);box-shadow:0 0 0 1px var(--green);animation:none; }
@keyframes pulseDot{ 0%,100%{box-shadow:0 0 0 1px var(--accent)} 50%{box-shadow:0 0 0 6px var(--accent-soft)} }
.oc-step-label{
  font-size:8px;font-weight:700;color:var(--text3);text-align:center;
  letter-spacing:.02em;text-transform:uppercase;
}
.oc-step.done .oc-step-label{ color:var(--text2); }

/* Vertical stepper (Buy For Me timeline: 7 stages) */
.oc-vprogress{ display:flex;flex-direction:column; }
.oc-vstep{ display:flex;gap:12px;position:relative; }
.oc-vstep-rail{ display:flex;flex-direction:column;align-items:center;width:16px;flex-shrink:0; }
.oc-vdot{
  width:10px;height:10px;border-radius:50%;background:var(--border-strong);
  border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border-strong);
  flex-shrink:0;margin-top:2px;z-index:1;
}
.oc-vstep.done .oc-vdot{ background:var(--orange);box-shadow:0 0 0 1px var(--orange); }
.oc-vstep.current .oc-vdot{ background:var(--orange);box-shadow:0 0 0 1px var(--orange);animation:pulseDotOrange 1.6s ease-in-out infinite; }
.oc-vstep.delivered.done .oc-vdot{ background:var(--green);box-shadow:0 0 0 1px var(--green);animation:none; }
.oc-vline{ width:2px;flex:1;background:var(--border-strong);margin:2px 0;min-height:18px; }
.oc-vstep.done .oc-vline{ background:var(--orange); }
.oc-vstep:last-child .oc-vline{ display:none; }
.oc-vstep-body{ padding-bottom:16px;flex:1;min-width:0; }
.oc-vstep:last-child .oc-vstep-body{ padding-bottom:0; }
.oc-vstep-title{ font-size:12px;font-weight:700;color:var(--text3); }
.oc-vstep.done .oc-vstep-title{ color:var(--text); }
.oc-vstep.current .oc-vstep-title{ color:var(--orange); }
.oc-vstep-day{ font-size:10.5px;font-weight:600;color:var(--text3);margin-top:1px; }

.oc-track-link{
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:11px;font-family:var(--font-display);font-size:12.5px;font-weight:800;
  cursor:pointer;box-shadow:0 4px 14px rgba(10,155,220,0.22);
}
.oc-track-link:active{ transform:scale(.98); }

/* Footer nav */
.s-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;height:var(--bottom-nav-h);
  background:var(--surface);border-top:1px solid var(--border);
  backdrop-filter:blur(20px) saturate(1.2);

}
.s-nav-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--text3);font-size:10px;font-weight:600;cursor:pointer;
  transition:color .2s;padding:6px 12px;border-radius:10px;
  text-decoration:none;position:relative;
}
.s-nav-item.active{ color:var(--accent); }
.s-nav-item svg{ width:22px;height:22px; }
.s-nav-badge{
  position:absolute;top:0;right:6px;min-width:16px;height:16px;padding:0 4px;
  border-radius:9px;background:#e64848;color:#fff;font-size:9px;font-weight:700;
  line-height:16px;text-align:center;align-items:center;justify-content:center;
}
.s-nav-badge{display:flex;opacity:0;transform:scale(.4);pointer-events:none;overflow:hidden;box-shadow:0 2px 6px rgba(230,72,72,.35);transition:opacity .22s ease,transform .38s cubic-bezier(.2,.9,.3,1.3)}
.s-nav-badge.show{opacity:1;transform:scale(1)}
.s-nav-badge-num{display:block;font:inherit;line-height:inherit;will-change:transform,opacity}
@media (prefers-reduced-motion:reduce){.s-nav-badge{transition:opacity .01s}}

.oc-status-pill.unpaid,.oc-status-pill.awaiting_payment{ background:var(--orange-soft);color:var(--orange);border-color:rgba(242,100,48,0.4); }

/* ===== Swipe-to-remove (completed store orders) + confirm sheet + undo toast ===== */
/* overflow clips only while swiping: at rest it would cut the card's glow and mismatch its 16px radius */
.sw-wrap{position:relative;border-radius:16px;background:transparent;transition:background 0s .27s}
.sw-wrap.open,.sw-wrap.drag,.sw-wrap.leaving{background:#DC5252;overflow:hidden;transition:none}
.sw-wrap.leaving{margin-bottom:-12px;pointer-events:none;animation:svSortOut .35s cubic-bezier(.4,0,.2,1) forwards;transition:max-height .3s cubic-bezier(.4,0,.2,1) .18s,margin .3s cubic-bezier(.4,0,.2,1) .18s}
.sw-wrap.enter{opacity:0;margin-bottom:-12px}
.sw-wrap.enter-go{animation:svSortIn .45s cubic-bezier(.4,0,.2,1) forwards;transition:max-height .4s cubic-bezier(.4,0,.2,1),margin .4s cubic-bezier(.4,0,.2,1)}
@keyframes svSortOut{from{opacity:1;transform:scale(1) translateY(0)}to{opacity:0;transform:scale(.88) translateY(12px)}}
@keyframes svSortIn{from{opacity:0;transform:scale(.92) translateY(18px)}to{opacity:1;transform:scale(1) translateY(0)}}
.sw-act{position:absolute;top:0;right:0;bottom:0;width:88px;border:0;background:#DC5252;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--font-display);font-weight:800;font-size:12.5px;cursor:pointer;opacity:0;transition:opacity .2s ease;-webkit-tap-highlight-color:transparent}
.sw-act svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sw-wrap.open .sw-act,.sw-wrap.drag .sw-act{opacity:1}
.sw-wrap>.order-card{position:relative;touch-action:pan-y;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sw-wrap.drag>.order-card{transition:none}
.sw-wrap.open>.order-card{transform:translateX(-88px)}
.sv-was{margin-right:6px;font-weight:600;opacity:.55;text-decoration:line-through}
.oc-hidden-tag{margin-left:6px;padding:2px 8px;border-radius:999px;font-family:var(--font-display);font-size:10.5px;font-weight:800;color:var(--text2);background:var(--surface2);border:1px solid var(--border-strong)}
#storeList .so-v2 .oc-track-link.sw-rm{color:#DC5252}
.sv-modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(10,16,30,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sv-modal.show{display:flex}
.sv-box{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border-strong);border-radius:24px;padding:26px 20px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.28);animation:svPop .22s ease}
.sv-ico{width:58px;height:58px;margin:0 auto 14px;border-radius:50%;background:#DC5252;display:grid;place-items:center;box-shadow:0 8px 20px rgba(220,82,82,.35)}
.sv-ico svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round}
.sv-box h3{margin:0 0 6px;font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--text)}
.sv-box p{margin:0 0 20px;font-size:13.5px;font-weight:500;line-height:1.45;color:var(--text2)}
.sv-row{display:flex;gap:10px}
.sv-row button{flex:1;height:46px;border-radius:14px;font-family:var(--font-display);font-weight:800;font-size:14px;cursor:pointer;border:1.5px solid var(--border-strong);background:transparent;color:var(--text2)}
.sv-row button.danger{background:#DC5252;border-color:#DC5252;color:#fff}
.sv-row button:disabled{opacity:.6}
.sv-toast{position:fixed;left:16px;right:16px;bottom:calc(var(--bottom-nav-h) + 14px + env(safe-area-inset-bottom,0px));z-index:310;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;background:#0f2a4a;color:#fff;font-size:13px;font-weight:600;box-shadow:0 10px 28px rgba(0,0,0,.3);animation:svPop .2s ease}
.sv-toast button{background:none;border:0;color:#38bdf8;font-family:var(--font-display);font-weight:800;font-size:13px;cursor:pointer;padding:4px 2px}
@keyframes svPop{from{transform:scale(.95) translateY(6px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sw-wrap,.sw-wrap.leaving,.sw-wrap.leaving>.order-card,.sw-wrap.enter-go,.sw-wrap>.order-card,.sw-act{transition:none!important;animation:none!important}.sv-box,.sv-toast{animation:none}}
</style>

<script>
const S = { theme: localStorage.getItem('sv-theme') || 'light' };
const HIST = new URLSearchParams(location.search).get('view') === 'history';
if(HIST){
  document.title = 'Order History | SuppVerse BD';

  const _b = document.querySelector('.header-back'); if(_b) _b.onclick = () => { window.location.href = 'profile.html'; };
}
function applyTheme(){
  document.body.classList.toggle('dark-mode', S.theme === 'dark');
  const themeBtn = document.getElementById('themeToggle');
  if(themeBtn) themeBtn.classList.toggle('dark', S.theme === 'dark');

const themeToggleBtn2 = document.getElementById('themeToggle');

  S.theme = S.theme === 'light' ? 'dark' : 'light';

var __svBadgeLast = 0;
  function svRefreshCartBadge(){
    try{
      var cart = JSON.parse(localStorage.getItem('sv-cart-internal') || '[]');
      var count = Array.isArray(cart) ? cart.reduce(function(n,i){return n+(i.qty||1);},0) : 0;
      count += parseInt(localStorage.getItem('sv-cart-proxy-badge'),10) || 0;
      var badge = document.getElementById('svNavCartBadge');
      if(!badge) return;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var num = badge.firstElementChild;
      if(!num || !num.classList.contains('s-nav-badge-num')){
        badge.textContent = '';
        num = document.createElement('b');
        num.className = 's-nav-badge-num';
        badge.appendChild(num);
      }
      if(count > 0){
        var label = count > 99 ? '99+' : String(count);
        var wasShown = badge.classList.contains('show');
        var prev = __svBadgeLast;
        badge.__label = label;
        if(num.textContent !== label){
          if(wasShown && !reduce && num.animate){
            var dir = count > prev ? 1 : -1;
            var out = num.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY('+(-7*dir)+'px)',opacity:0}],{duration:110,easing:'ease-in',fill:'forwards'});
            out.onfinish = function(){
              num.textContent = badge.__label;
              var inn = num.animate([{transform:'translateY('+(7*dir)+'px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:170,easing:'cubic-bezier(.2,.9,.3,1.2)'});
              inn.onfinish = function(){ out.cancel(); };
            };
            if(count > prev && badge.animate){
              badge.animate([{transform:'scale(1)'},{transform:'scale(1.28)',offset:.4},{transform:'scale(1)'}],{duration:340,easing:'ease-out'});
            }
          } else { num.textContent = label; }
        }
        if(!wasShown) requestAnimationFrame(function(){ badge.classList.add('show'); });
      } else {
        badge.classList.remove('show');
      }
      __svBadgeLast = count;
    }catch(e){}
  }
  window.svRefreshCartBadge = svRefreshCartBadge;
  svRefreshCartBadge();
  window.addEventListener('pageshow', svRefreshCartBadge);
  window.addEventListener('storage', function(e){ if(!e.key || e.key === 'sv-cart-internal' || e.key === 'sv-cart-proxy-badge') svRefreshCartBadge(); });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) svRefreshCartBadge(); });

const tabProxy = document.getElementById('tabProxyOrders');
const viewStore = document.getElementById('viewStoreOrders');
const viewProxy = document.getElementById('viewProxyOrders');

svInitHeaderAuth('headerAccountBtn');

/* ===== Buy For Me orders (live) =====
   PX_FLOW is the timeline. Not final: edit titles / order / keys here only.
   Keys must match proxy_requests.status values. */
const PX_FLOW = [
  { k:'pending_quote', t:'Request sent' },
  { k:'quoted',        t:'Quote ready' },
  { k:'approved',      t:'Order confirmed' },
  { k:'paid',          t:'Payment received' },
  { k:'purchasing',    t:'Purchasing' },
  { k:'ordered',       t:'Ordered from store' },
  { k:'shipped_intl',  t:'Shipped to Bangladesh' },
  { k:'arrived_bd',    t:'Arrived in Bangladesh' },
  { k:'delivered',     t:'Delivered' }
];
const PX_PILL = {
  pending_quote:['Awaiting quote','quote'], quoted:['Quote ready','quote'], approved:['Awaiting payment','quote'],
  paid:['Paid','paid'], purchasing:['Purchasing','purchased'], ordered:['Ordered','purchased'],
  shipped_intl:['Shipped','shipped'], arrived_bd:['In Bangladesh','shipped'], delivered:['Delivered','delivered'],
  rejected:['Declined by us','closed'], cancelled:['Cancelled','closed'], expired:['Quote expired','closed']
};
const PX_CLOSED_MSG = {
  rejected:'We could not take this request. Contact us on WhatsApp for details.',
  cancelled:'This request was cancelled.',
  expired:'This quote expired. Send a new request or message us to get a fresh quote.'
};
function pxEsc(t){ return String(t==null?'':t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pxDate(iso){
  const d = new Date(iso); if(isNaN(d)) return '';
  return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getFullYear();
}
function pxUsd(n){ return '$'+(Number(n)||0).toFixed(2); }
function pxBdt(n){ return '৳'+Math.round(Number(n)||0).toLocaleString('en-US'); }

const NOTE_IC = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
function pxNoteH(t){ return t ? '<div class="px-note" onclick="this.classList.toggle(\'open\')"><div class="px-note-lbl">' + NOTE_IC + 'Your note</div><div class="px-note-txt">' + pxEsc(t) + '</div></div>' : ''; }
function pxRender(r){
  const snap = r.product_snapshot || {};
  const items = (snap.items || []).map(i => ({ name:i.name||'Product', store:i.store||'', qty:Math.max(1,parseInt(i.qty,10)||1), price:Number(i.price)||0 }));
  const f = r.fee_snapshot || {};
  const usd = items.reduce((t,i)=>t+i.qty*i.price,0);
  const taxP = Number(f.sales_tax)||0, svcP = Number(f.service_charge)||0, rate = Number(f.usd_rate)||0;
  const tax = usd*taxP/100, svc = usd*svcP/100;
  const est = rate ? (usd+tax+svc)*rate : 0;
  const quoted = r.quote_total != null;
  const pill = PX_PILL[r.status] || [r.status,'quote'];
  const ord = r.orders || null;
  const isOrder = !!(ord && ord.order_number);
  const idPill = isOrder ? '<span class="oc-id-label">Order ID</span><div class="oc-id proxy">'+pxEsc(ord.order_number)+'</div>'
                         : '<span class="oc-id-label">Request ID</span><div class="oc-id rq">'+pxEsc(r.request_no||'RQ')+'</div>';
  const expired = r.status==='quoted' && r.expires_at && new Date(r.expires_at) < new Date();
  const closed = ['rejected','cancelled','expired'].includes(r.status) || expired;
  const curIdx = PX_FLOW.findIndex(x => x.k === r.status);

  const itemRows = items.map(i =>
    '<div class="oc-item-row"><div style="flex:1;min-width:0"><div class="oc-item-name-row"><div class="oc-item-name">'+pxEsc(i.name)+'</div></div>'
    +(i.store?'<div class="oc-item-sub">'+pxEsc(i.store)+'</div>':'')+'</div>'
    +'<div class="oc-item-math"><div class="oc-item-qtyprice">'+i.qty+' × '+pxUsd(i.price)+'</div><div class="oc-item-linetotal">'+pxUsd(i.qty*i.price)+'</div></div></div>').join('');

  let math = '<div class="oc-math-card">';
  if(usd>0){
    math += '<div class="oc-math-row"><span>Product cost</span><span>'+pxUsd(usd)+'</span></div>';
    if(rate){
      math += '<div class="oc-math-row"><span>US sales tax ('+taxP+'%)</span><span>'+pxUsd(tax)+'</span></div>'
            + '<div class="oc-math-row"><span>Service charge ('+svcP+'%)</span><span>'+pxUsd(svc)+'</span></div>'
            + '<div class="oc-math-row"><span>Rate</span><span>1 USD = '+pxBdt(rate)+'</span></div>';
    }
  }
  if(quoted) math += '<div class="oc-math-row total"><span>Final price</span><span>'+pxBdt(r.quote_total)+'</span></div>';
  else if(est) math += '<div class="oc-math-row total"><span>Estimate (final after quote)</span><span>'+pxBdt(est)+'</span></div>';
  math += '</div>';
  const preview = quoted ? pxBdt(r.quote_total) : (est ? '≈ '+pxBdt(est) : '');

  let action = '';
  if(r.status==='quoted' && !expired){
    action = '<div class="px-quote"><div class="px-quote-top"><div><div class="px-quote-lbl">Your quote</div><div class="px-quote-amt">'+pxBdt(r.quote_total)+'</div></div>'
      + (r.expires_at?'<div class="px-quote-exp">Valid until<br>'+pxDate(r.expires_at)+'</div>':'')+'</div>'
      + '<div class="px-quote-btns"><button class="px-btn decline" data-act="decline" data-id="'+r.id+'">Decline</button><button class="px-btn accept" data-act="accept" data-id="'+r.id+'">Accept &amp; confirm</button></div></div>';
  } else if(r.status==='approved' && r.order_id){
    action = '<div class="px-quote"><div class="px-quote-top"><div><div class="px-quote-lbl">Amount to pay</div><div class="px-quote-amt">'+pxBdt(r.quote_total)+'</div></div></div>'
      + '<div class="px-quote-btns"><button class="px-btn pay" data-act="pay" data-id="'+pxEsc(r.order_id)+'">Pay now</button></div></div>';
  } else if(r.status==='pending_quote'){
    action = '<div class="px-info">We are reviewing your request. We will send your quote on WhatsApp.</div>';
  }
  if(closed){
    action = '<div class="px-banner">'+pxEsc(expired ? PX_CLOSED_MSG.expired : (PX_CLOSED_MSG[r.status]||''))+'</div>';
  }

  let timeline = '';
  if(!closed){
    const dateFor = (k) => k==='pending_quote' ? r.created_at : k==='quoted' ? r.quoted_at : (k===r.status ? r.updated_at : '');
    timeline = '<div><div class="oc-section-label">Order Timeline</div><div class="oc-vprogress">'
      + PX_FLOW.map((st,i)=>({st,i})).reverse().map(({st,i}) => {
          const done = i <= curIdx, cur = i === curIdx;
          const d = done ? dateFor(st.k) : '';
          return '<div class="oc-vstep'+(done?' done':'')+(cur?' current':'')+(st.k==='delivered'?' delivered':'')+'">'
            +'<div class="oc-vstep-rail"><div class="oc-vdot"></div><div class="oc-vline"></div></div>'
            +'<div class="oc-vstep-body"><div class="oc-vstep-title">'+pxEsc(st.t)+'</div>'+(d?'<div class="oc-vstep-day">'+pxDate(d)+'</div>':'')+'</div></div>';
        }).join('')
      + '</div></div>';
  }

  return '<div class="order-card" data-rid="'+r.id+'">'
    +'<div class="oc-head" onclick="this.closest(\'.order-card\').classList.toggle(\'collapsed\')">'
      +'<div class="oc-head-left"><div class="oc-id-row">'+idPill+'</div><div class="oc-meta">Submitted <span class="oc-meta-date">'+soDateTime(r.created_at)+'</span></div></div>'
      +'<div class="oc-head-right"><div class="oc-status-wrap"><span class="oc-status-pill '+(expired?'closed':pill[1])+'">'+pxEsc(expired?'Quote expired':pill[0])+'</span><span class="oc-status-date">'+soDateTime(expired ? (r.expires_at||r.updated_at) : r.status==='pending_quote' ? r.created_at : r.status==='quoted' ? (r.quoted_at||r.updated_at) : (r.updated_at||r.created_at))+'</span></div>'
      +'<svg class="oc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div></div>'
    +'<div class="so-collapse"><div class="so-inner"><div class="oc-body">'+action
      +'<div class="oc-subsection"><div class="oc-subhead" onclick="this.closest(\'.oc-subsection\').classList.toggle(\'collapsed\')"><div class="oc-section-label">Items &amp; Summary</div>'
      +'<div class="oc-subhead-right"><span class="oc-subtotal-preview">'+preview+'</span><svg class="oc-sub-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div></div>'
      +'<div class="oc-subsection-content"><div>'+itemRows+pxNoteH(snap.notes)+math+'</div></div></div>'
      +timeline
    +'</div></div></div></div>';
}

async function loadProxyOrders(){
  const list = document.getElementById('proxyList');
  if(!list) return;
  let session = null;
  try{ const r = await sbClient.auth.getSession(); session = r.data && r.data.session; }catch(e){}
  if(!session){
    list.innerHTML = '<div class="px-state">Log in to see your Buy For Me requests.<br><br><a href="login.html" id="pxLoginLink">Log in</a></div>';
    const l = document.getElementById('pxLoginLink');
    if(l) l.addEventListener('click', () => { try{ sessionStorage.setItem('sv-login-return','orders.html'); }catch(e){} });
    return;
  }
  const { data: allRows, error } = await sbClient.from('proxy_requests')
    .select('*, orders(order_number,status)').order('created_at', { ascending:false });
  if(error){ console.error('proxy_requests load error:', error); list.innerHTML = '<div class="px-state">Could not load your orders. Pull down to retry.</div>'; return; }
  const data = (allRows || []).filter(pxConfirmed);
  if(window.svProxyBadgeSet) window.svProxyBadgeSet(data || []);
  setTabCount('tabProxyCount', (data || []).filter(pxRunning).length);
  if(!data || !data.length){
    list.innerHTML = '<div class="px-state">No confirmed Buy For Me orders yet.<br>Requests, quotes and unpaid orders are in Cart &rarr; Proxy Quote.<br><br><a href="cart.html#proxy">Open Proxy Quote</a></div>';
    return;
  }
  const open = new Set([...list.querySelectorAll('.order-card:not(.collapsed)')].map(c=>c.dataset.rid));
  const rows = HIST ? data.filter(r => ['delivered','rejected','cancelled','expired'].includes(r.status) || pxExpiredQuote(r)) : data.filter(r => !pxStale(r));
  if(!rows.length){ list.innerHTML = HIST ? '<div class="px-state">No completed Buy For Me orders yet.</div>' : '<div class="px-state">No active Buy For Me orders.<br>Past ones are in Profile &rarr; Order History.<br><br><a href="orders.html?view=history#proxy">Open Order History</a></div>'; return; }
  const pxDone = r => ['delivered','rejected','cancelled','expired'].includes(r.status) || pxExpiredQuote(r);
  rows.sort((a, b) => (pxDone(a) - pxDone(b)));
  list.innerHTML = rows.map((r, i) => ((!HIST && pxDone(r) && !rows.slice(0, i).some(pxDone)) ? '<div class="oc-sep">Past Orders</div>' : '') + pxRender(r)).join('');
  if(open.size) list.querySelectorAll('.order-card').forEach(c => { if(!open.has(c.dataset.rid)) c.classList.add('collapsed'); });
}


/* ===== Store orders (live) ===== */
const SO_FINAL = ['delivered','cancelled'];
/* Auto-hide from the Orders tab (display only; nothing is deleted, Order History keeps everything). */
const AUTO_HIDE_DELIVERED_DAYS = 7, AUTO_HIDE_CLOSED_DAYS = 3;
const soAged = (iso, days) => { const t = Date.parse(iso); return !!t && (Date.now() - t) > days * 86400000; };
const soStale = o => SO_FINAL.includes(o.state) && (o.state === 'delivered' ? soAged(o.delivered_at, AUTO_HIDE_DELIVERED_DAYS) : soAged(o.cancelled_at || o.created_at, AUTO_HIDE_CLOSED_DAYS));
const PX_CONFIRMED = ['paid','purchasing','ordered','shipped_intl','arrived_bd','delivered'];
/* Orders tab = confirmed orders only. Requests + quotes (pending_quote, quoted) live in Cart -> Proxy Quote. */
const pxConfirmed = r => r.status !== 'approved' && (!!r.order_id || PX_CONFIRMED.includes(r.status));
const pxExpiredQuote = r => r.status === 'quoted' && r.expires_at && new Date(r.expires_at) < new Date();
const pxRunning = r => !(['delivered','rejected','cancelled','expired'].includes(r.status) || pxExpiredQuote(r));
function setTabCount(id, n){
  const el = document.getElementById(id); if(!el) return;
  n = HIST ? 0 : n;
  if(n > 0){ el.textContent = n > 99 ? '99+' : String(n); el.classList.add('show'); }
  else { el.classList.remove('show'); el.textContent = ''; }
}
const pxStale = r => r.status === 'delivered' ? soAged(r.updated_at, AUTO_HIDE_DELIVERED_DAYS)
  : (['rejected','cancelled','expired'].includes(r.status) ? soAged(r.updated_at, AUTO_HIDE_CLOSED_DAYS) : (pxExpiredQuote(r) ? soAged(r.expires_at, AUTO_HIDE_CLOSED_DAYS) : false));
let soHidden = new Set(), soSwipeBusy = false, soEnterId = null, soStates = {};
const SO_LABEL = { awaiting_payment:'Awaiting payment', unpaid:'Unpaid', verifying:'Verifying payment', cod_pending:'Pending (COD)', paid:'Paid', processing:'Processing', shipped:'Shipped', delivered:'Delivered', cancelled:'Cancelled' };
function soEsc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function soImgFail(el){ el.replaceWith(Object.assign(document.createElement('span'),{innerHTML:SO_ICO.box}).firstChild); }
function soMoney(n){ return '৳' + Number(n || 0).toLocaleString('en-IN'); }
function soDateTime(iso){ try{ const d = new Date(iso); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) + ', ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }
function soDate(iso){ try{ return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return ''; } }
function soLeft(untilIso){
  const ms = new Date(untilIso).getTime() - Date.now();
  if(!(ms > 0)) return '0m';
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60);
  return h > 0 ? h + 'h ' + (m % 60) + 'm' : m + 'm';
}
function soNote(o){
  if(o.state === 'awaiting_payment') return '<div class="so-note">Waiting for your payment. '+(o.voucher_code ? 'Your voucher is held for you' : 'Please complete it')+' until <b data-until="'+soEsc(o.pay_expires_at)+'" data-fmt="clock"></b>. Go back to checkout to pay.</div>';
  if(o.state === 'unpaid') return '<div class="so-note">Not paid yet. This order will be cancelled automatically in <b data-until="'+soEsc(o.auto_cancel_at)+'" data-fmt="left"></b>. Already sent the money? Contact us with your transaction ID.<button class="so-btn" data-act="repay" data-id="'+soEsc(o.id)+'">Pay again</button></div>';
  if(o.state === 'verifying') return '<div class="so-note info">We received your transaction ID ('+soEsc(o.payment_ref)+') and will confirm your payment shortly.</div>';
  if(o.state === 'cod_pending') return '<div class="so-note info">Cash on delivery. We will confirm this order with you.</div>';
  if(o.state === 'cancelled') return '<div class="so-note bad">Cancelled: '+soEsc(o.cancel_reason || 'Cancelled')+'.'+(o.cancel_reason === 'Not paid in time' ? '<button class="so-btn" data-act="repay" data-id="'+soEsc(o.id)+'">Order again</button>' : '')+'</div>';
  return '';
}
function soRender(o){
  const label = SO_LABEL[o.state] || (o.state ? o.state.charAt(0).toUpperCase() + o.state.slice(1) : 'Order');
  const items = (o.items || []).map(i => '<div class="so-item"><span>'+soEsc(i.name)+' <small>× '+soEsc(i.qty)+'</small></span><span>'+soMoney(Number(i.price) * Number(i.qty))+'</span></div>').join('');
  const disc = Number(o.discount) > 0 ? '<div><span>Discount'+(o.voucher_code ? ' (<span class="vcode">'+soEsc(o.voucher_code)+'</span>)' : '')+'</span><span>-'+soMoney(o.discount)+'</span></div>' : '';
  const ship = '<div><span>Shipping</span><span>'+(Number(o.shipping) === 0 ? 'Free' : soMoney(o.shipping))+'</span></div>';
  return '<div class="order-card collapsed" data-oid="'+soEsc(o.id)+'">'
    +'<div class="oc-head" onclick="this.closest(\'.order-card\').classList.toggle(\'collapsed\')">'
      +'<div class="oc-head-left"><div class="oc-id-row"><span class="oc-id-label">Order ID</span><div class="oc-id store">'+soEsc(o.order_number)+'</div></div>'
      +'<div class="oc-meta">Created at <span class="oc-meta-date">'+soDateTime(o.created_at)+'</span></div></div>'
      +'<div class="oc-head-right"><div class="oc-status-wrap"><span class="oc-status-pill '+soEsc(o.state)+'">'+soEsc(label)+'</span></div>'
      +'<svg class="oc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div>'
    +'</div>'
    +'<div class="so-collapse"><div class="so-inner"><div class="oc-body">'
      +'<div class="so-items">'+items+'</div>'
      +'<div class="so-sum"><div><span>Subtotal</span><span>'+soMoney(o.subtotal)+'</span></div>'+disc+ship
      +'<div class="so-total"><span>Total</span><span>'+soMoney(o.total)+'</span></div></div>'
      +soNote(o)

/* ===== Swipe to remove completed orders from the Orders tab (soft hide, never deletes) ===== */
(function(){
  const list = document.getElementById('storeList'), OPEN_W = 88;
  if(!list) return;
  let w = null, card = null, x0 = 0, y0 = 0, dx = 0, base = 0, dragging = false, down = false, justDragged = false;
  const closeAll = except => list.querySelectorAll('.sw-wrap.open').forEach(x => { if(x !== except) x.classList.remove('open'); });
  list.addEventListener('pointerdown', e => {
    const t = e.target.closest('.sw-wrap'); if(!t || e.target.closest('.sw-act') || e.button > 0) return;
    closeAll(t); w = t; card = t.querySelector('.order-card');
    x0 = e.clientX; y0 = e.clientY; dx = 0; dragging = false; down = true; base = t.classList.contains('open') ? -OPEN_W : 0;
  });
  list.addEventListener('pointermove', e => {
    if(!down || !w) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if(!dragging){
      if(Math.abs(mx) < 8 || Math.abs(mx) < Math.abs(my)) return;
      dragging = true; soSwipeBusy = true; w.classList.add('drag');
      try{ card.setPointerCapture(e.pointerId); }catch(_){}
    }
    dx = mx;
    card.style.transform = 'translateX(' + Math.max(-OPEN_W, Math.min(0, base + dx)) + 'px)';
  });
  const end = () => {
    if(!down) return; down = false;
    if(dragging){
      const open = (base + dx) < -OPEN_W / 2;
      w.classList.remove('drag'); card.style.transform = ''; w.classList.toggle('open', open);
      justDragged = true; setTimeout(() => { justDragged = false; }, 60);
    }
    dragging = false; soSwipeBusy = !!list.querySelector('.sw-wrap.open'); w = card = null;
  };
  list.addEventListener('pointerup', end); list.addEventListener('pointercancel', end);
  /* A swipe or a tap on an open card must not toggle expand/collapse. */
  list.addEventListener('click', e => {
    const t = e.target.closest('.sw-wrap'); if(!t) return;
    if(justDragged){ e.stopPropagation(); e.preventDefault(); return; }
    if(t.classList.contains('open') && !e.target.closest('.sw-act')){ e.stopPropagation(); e.preventDefault(); t.classList.remove('open'); soSwipeBusy = false; }
  }, true);
  document.addEventListener('pointerdown', e => { if(!e.target.closest('.sw-wrap') && !e.target.closest('.sv-modal')){ closeAll(); soSwipeBusy = false; } });
})();

document.getElementById('rmCancel').addEventListener('click', rmClose);
rmModal.addEventListener('click', e => { if(e.target === rmModal) rmClose(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && rmModal.classList.contains('show')) rmClose(); });
document.addEventListener('click', async e => {
  const sw = e.target.closest('.sw-act'); if(sw){ const w = sw.closest('.sw-wrap'); rmOpen(w.dataset.oid, w.dataset.no); return; }
  const b = e.target.closest('.oc-track-link[data-act="hide"], .oc-track-link[data-act="unhide"]'); if(!b) return;
  if(b.dataset.act === 'hide'){ rmOpen(b.dataset.id, b.dataset.no); return; }
  b.disabled = true;
  if(await soSetHidden(b.dataset.id, false)){ soHidden.delete(b.dataset.id); svToast(b.dataset.no + ' is back in your Orders tab'); loadStoreOrders(); }
  else { b.disabled = false; svToast('Could not update ' + b.dataset.no + '. Please try again.'); }
});
let _soBusy = false;
async function loadStoreOrders(){
  const list = document.getElementById('storeList');
  if(!list || _soBusy) return;
  _soBusy = true;
  try{
    let session = null;
    try{ const r = await sbClient.auth.getSession(); session = r.data && r.data.session; }catch(e){}
    if(!session){
      list.innerHTML = '<div class="px-state">Log in to see your orders.<br><br><a href="login.html" id="soLoginLink">Log in</a></div>';
      const l = document.getElementById('soLoginLink');
      if(l) l.addEventListener('click', () => { try{ sessionStorage.setItem('sv-login-return','orders.html'); }catch(e){} });
      return;
    }
    if(soSwipeBusy) return;
    const [res, hres] = await Promise.all([ sbClient.rpc('my_orders'), sbClient.rpc('my_hidden_orders').then(r => r, () => null) ]);
    if(res.error || !res.data || !res.data.ok){
      list.innerHTML = '<div class="px-state">Could not load your orders. Please try again.</div>';
      return;
    }
    soHidden = new Set((hres && !hres.error && hres.data && hres.data.ok && hres.data.ids) || []);
    const all = res.data.orders || [];
    if(window.svOrdersBadgeSet) window.svOrdersBadgeSet(all);
    setTabCount('tabStoreCount', all.filter(o => !SO_FINAL.includes(o.state)).length);
    const orders = HIST ? all.filter(o => SO_FINAL.includes(o.state)) : all.filter(o => !(SO_FINAL.includes(o.state) && (soHidden.has(o.id) || soStale(o))));
    if(!orders.length){
      list.innerHTML = HIST ? '<div class="px-state">No completed orders yet.</div>'
        : (all.length ? '<div class="px-state">No orders here.<br>Past orders are in Profile &rarr; Order History.<br><br><a href="orders.html?view=history">Open Order History</a></div>'
                      : '<div class="px-state">No orders yet.<br><br><a href="store.html">Browse the store</a></div>');
      return;
    }
    const prev = new Map([...list.querySelectorAll('.order-card')].map(c => [c.dataset.oid, c.classList.contains('collapsed')]));
    const act = x => !SO_FINAL.includes(x.state);
    orders.sort((a, b) => (act(b) - act(a)));   /* running orders pinned on top (stable: newest first inside each group) */
    list.innerHTML = orders.map((o, i) => {
      const fin = SO_FINAL.includes(o.state);
      const sep = (!HIST && fin && !orders.slice(0, i).some(x => SO_FINAL.includes(x.state))) ? '<div class="oc-sep">Past Orders</div>' : '';
      /* running = expanded by default; finished = collapsed. A card the customer collapsed/expanded keeps that choice, unless it just finished. */
      const collapsed = fin ? (HIST || !prev.has(o.id) || soStates[o.id] !== o.state ? true : prev.get(o.id)) : (prev.has(o.id) ? prev.get(o.id) : false);
      const card = soRenderV2(o, { collapsed });
      return sep + ((!HIST && SO_FINAL.includes(o.state))
        ? '<div class="sw-wrap" data-oid="'+soEsc(o.id)+'" data-no="'+soEsc(o.order_number)+'"><button class="sw-act" type="button" tabindex="-1" aria-label="Remove '+soEsc(o.order_number)+' from Orders tab"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>Remove</button>'+card+'</div>'
        : card);
    }).join('');
    if(soEnterId){
      const en = list.querySelector('.sw-wrap[data-oid="' + soEnterId + '"]'); soEnterId = null;
      if(en){
        const h = en.scrollHeight; en.style.maxHeight = '0px'; en.classList.add('enter'); void en.offsetHeight;
        en.classList.add('enter-go'); en.classList.remove('enter'); en.style.maxHeight = h + 'px';
        setTimeout(() => { en.style.maxHeight = ''; en.classList.remove('enter-go'); }, 500);
      }
    }
    soStates = Object.fromEntries(orders.map(o => [o.id, o.state]));
    soTick();
  } finally { _soBusy = false; }
}
document.addEventListener('click', function(e){
  const b = e.target.closest && e.target.closest('.so-btn, .oc-action[data-act="repay"], .oc-action[data-act="paynow"]'); if(!b) return;
  const id = b.dataset.id;
  sbClient.rpc('my_orders').then(res => {
    const o = res && res.data && res.data.orders && res.data.orders.find(x => x.id === id);
    if(!o) return;
    let cartNow = []; try{ cartNow = JSON.parse(localStorage.getItem('sv-cart-internal') || '[]'); }catch(e){}
    if(cartNow.length && !confirm('Your cart will be replaced with the items from order ' + o.order_number + '. Continue?')) return;
    const cart = (o.items || []).map(i => ({ sku:i.sku, name:i.name, price:Number(i.price), qty:Number(i.qty), img:i.image || null }));
    try{
      localStorage.setItem('sv-cart-internal', JSON.stringify(cart));
      sessionStorage.setItem('sv-unpaid-order', o.id);
    }catch(e){}
    location.href = 'payment.html';
  });
});
/* Download invoice (paid / delivered orders; COD also while processing / shipped, shown as due): builds the A4 PDF in the browser from the order row */
document.addEventListener('click', async function(e){
  const b = e.target.closest && e.target.closest('.oc-action[data-act="invoice"]'); if(!b || b.disabled) return;
  const label = b.textContent; b.disabled = true; b.textContent = 'Preparing invoice…';
  try{
    const res = await sbClient.rpc('my_orders');
    const o = res && res.data && res.data.orders && res.data.orders.find(x => x.id === b.dataset.id);
    if(!o) throw new Error('Order not found');
    if(!window.svInvoice) throw new Error('Invoice module not loaded');
    await window.svInvoice.download(o);
  }catch(err){
    console.error('invoice error:', err);
    alert(err && err.userMessage ? 'Could not create your invoice: ' + err.userMessage : 'Could not create your invoice. Please check your connection and try again.');
  }finally{ b.disabled = false; b.textContent = label; }
});
loadStoreOrders();
setInterval(soTick, 30000);
setInterval(() => { if(!document.hidden) loadStoreOrders(); }, 60000);
window.addEventListener('pageshow', e => { if(e.persisted) loadStoreOrders(); });
document.addEventListener('visibilitychange', () => { if(!document.hidden) loadStoreOrders(); });

document.addEventListener('click', async function(e){
  const b = e.target.closest && e.target.closest('.px-btn'); if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if(act==='pay'){ window.location.href = 'payment.html?order=' + encodeURIComponent(id); return; }
  if(act==='decline' && !confirm('Decline this quote? The request will be cancelled.')) return;
  b.disabled = true;
  try{
    const { error } = await sbClient.rpc('customer_respond_quote', { p_id:id, p_accept: act==='accept' });
    if(error) throw error;
  }catch(err){
    console.error('customer_respond_quote error:', err);
    alert('Could not update your request. Please try again.');
  }
  await loadProxyOrders();
});

if(location.hash === '#proxy') { tabProxy.click(); }
loadProxyOrders();
window.addEventListener('pageshow', loadProxyOrders);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) loadProxyOrders(); });
</script>
