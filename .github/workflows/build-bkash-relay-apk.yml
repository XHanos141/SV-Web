name: Build bKash Relay APK

on:
  push:
    branches: [ main ]
    paths:
      - 'bkash-relay-app/**'
      - '.github/workflows/build-bkash-relay-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bkash-relay-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bkash-relay-debug-apk
          path: bkash-relay-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
